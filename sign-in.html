<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef5ff 0%, #f9fbff 100%);
        color: #1c2430;
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border: 1px solid #e5ebf3;
        border-radius: 20px;
        box-shadow: 0 18px 45px rgba(17, 45, 88, 0.08);
        padding: 32px 28px;
      }

      .logo {
        font-size: 1.7rem;
        font-weight: 700;
        letter-spacing: -0.04em;
        margin-bottom: 8px;
      }

      .logo span {
        color: #1f6feb;
      }

      .subtitle {
        color: #5c6775;
        margin: 0 0 24px;
        font-size: 0.96rem;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 0.9rem;
        color: #2a3342;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 14px 14px;
        font-size: 1rem;
        border: 1px solid #dfe7f1;
        border-radius: 12px;
        outline: none;
        transition: 0.2s ease;
      }

      input:focus {
        border-color: #1f6feb;
        box-shadow: 0 0 0 4px rgba(31, 111, 235, 0.12);
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.85rem;
        color: #5c6775;
      }

      .row a {
        color: #1f6feb;
        text-decoration: none;
        font-weight: 600;
      }

      .checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .checkbox input {
        width: 16px;
        height: 16px;
      }

      .btn {
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #1f6feb, #114eb8);
        color: white;
        font-size: 1rem;
        font-weight: 700;
        padding: 15px 18px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 22px rgba(31, 111, 235, 0.24);
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #7a8698;
        font-size: 0.8rem;
        margin: 6px 0;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #e3eaf3;
      }

      .social {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .social button {
        background: #f5f8fd;
        color: #1f2a37;
        border: 1px solid #dfe7f1;
        border-radius: 10px;
        padding: 12px 14px;
        font-weight: 600;
        cursor: pointer;
      }

      .signup {
        text-align: center;
        margin-top: 18px;
        font-size: 0.92rem;
        color: #5c6775;
      }

      .signup a {
        color: #1f6feb;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <div class="logo"><span>Team</span>Project</div>
        <p class="subtitle">Welcome back! Please enter your details.</p>

        <form>
          <label>
            Email
            <input type="email" placeholder="you@example.com" />
          </label>

          <label>
            Password
            <input type="password" placeholder="Enter your password" />
          </label>

          <div class="row">
            <label class="checkbox">
              <input type="checkbox" />
              <span>Remember me</span>
            </label>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit" class="btn">Sign In</button>
        </form>

        <div class="divider">or continue with</div>

        <div class="social">
          <button type="button">Google</button>
          <button type="button">GitHub</button>
        </div>

        <div class="signup">
          Don’t have an account? <a href="#">Sign up</a>
        </div>
      </div>
    </div>
  </body>
</html>
