<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Sova Reth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f8f9fb;
    --panel:#ffffff;
    --ink:#111318;
    --muted:#5b6572;
    --accent:#2451b4;
    --accent-soft:#e8edf9;
    --line: rgba(17,19,24,0.10);
    --maxw: 1100px;
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display:flex;
    flex-direction: column;
  }

  a{ color: inherit; text-decoration:none; }
  a:focus-visible, button:focus-visible, input:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  h1,h2,h3{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    line-height: 1.1;
    margin: 0;
  }

  .wrap{
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 32px;
  }

  header{
    padding: 26px 0;
  }
  header .wrap{
    display:flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 19px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .logo .dot{
    width:9px; height:9px;
    border-radius:50%;
    background: var(--accent);
    display:inline-block;
  }
  nav ul{
    list-style:none;
    display:flex;
    gap: 28px;
    margin:0;
    padding:0;
    font-size: 15px;
  }
  nav a{ color: var(--muted); }
  nav a:hover{ color: var(--ink); }
  nav a.active{ color: var(--ink); font-weight: 500; }

  .btn{
    display:inline-flex;
    align-items:center;
    padding: 11px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    border: 1px solid var(--line);
  }
  .btn.ghost:hover{ background: var(--panel); border-color: var(--ink); }

  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 24px 64px;
  }

  .auth-card{
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 40px 36px;
  }

  .kicker{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 20px;
    margin-bottom: 20px;
  }

  .auth-card h1{
    font-size: 28px;
  }
  .auth-card p.lede{
    color: var(--muted);
    margin: 10px 0 28px;
    font-size: 15px;
  }

  .field{ margin-bottom: 18px; }
  .field label{
    display:block;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .field input{
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: var(--ink);
    background: var(--paper);
  }
  .field input::placeholder{ color: #9aa1ab; }
  .field .hint{
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 6px;
  }

  .check-row{
    display:flex;
    align-items:flex-start;
    gap: 10px;
    margin: 22px 0 24px;
    font-size: 13.5px;
    color: var(--muted);
  }
  .check-row input{
    margin-top: 3px;
    accent-color: var(--accent);
  }
  .check-row a{ color: var(--accent); }
  .check-row a:hover{ text-decoration: underline; }

  .auth-card button[type="submit"]{
    width: 100%;
    padding: 13px 20px;
    border-radius: 8px;
    border: none;
    background: var(--ink);
    color: var(--panel);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
  }
  .auth-card button[type="submit"]:hover{ background:#2a2e37; }

  .divider{
    display:flex;
    align-items:center;
    gap: 14px;
    margin: 26px 0;
    color: var(--muted);
    font-size: 13px;
  }
  .divider::before,
  .divider::after{
    content:"";
    flex:1;
    height:1px;
    background: var(--line);
  }

  .oauth{
    display:flex;
    flex-direction: column;
    gap: 10px;
  }
  .oauth button{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    width: 100%;
    padding: 11px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
  }
  .oauth button:hover{ border-color: var(--ink); }

  .switch-line{
    text-align:center;
    margin-top: 26px;
    font-size: 14px;
    color: var(--muted);
  }
  .switch-line a{ color: var(--accent); font-weight: 500; }
  .switch-line a:hover{ text-decoration: underline; }

  footer{
    padding: 24px 0 32px;
    color: var(--muted);
    font-size: 13.5px;
    text-align:center;
  }

  @media (max-width: 480px){
    header nav{ display:none; }
    .auth-card{ padding: 32px 24px; }
  }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <span class="logo"><span class="dot"></span>Sova Reth</span>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="work.html">Work</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <a class="btn ghost" href="#">Log in</a>
  </div>
</header>

<main>
  <div class="auth-card">
    <span class="kicker">Create account</span>
    <h1>Sign up</h1>
    <p class="lede">Create an account to get started — replace this with your own message.</p>

    <form action="#" method="post">
      <div class="field">
        <label for="fullname">Full name</label>
        <input id="fullname" name="fullname" type="text" placeholder="Your full name" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Create a password" required minlength="8">
        <div class="hint">At least 8 characters.</div>
      </div>

      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" placeholder="Re-enter your password" required minlength="8">
      </div>

      <div class="check-row">
        <input id="terms" name="terms" type="checkbox" required>
        <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label>
      </div>

      <button type="submit">Create account</button>
    </form>

    <div class="divider">or sign up with</div>

    <div class="oauth">
      <button type="button">Continue with Google</button>
      <button type="button">Continue with GitHub</button>
    </div>

    <div class="switch-line">
      Already have an account? <a href="#">Log in</a>
    </div>
  </div>
</main>

<footer>
  © 2026 Sova Reth
</footer>

</body>
</html>
